# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: abduelmorsi/jdmzn
  # OAuth client, so contributors sign in with GitHub instead of pasting a token.
  # Fine-grained tokens cannot reach a repo you are only a collaborator on.
  base_url: https://jdmzn-cms.aboodelmorsi.workers.dev

# Site-wide fallback only; the posts collection stores media entry-relative (see below).
media_folder: src/assets
public_folder: /src/assets

output:
  omit_empty_optional_fields: true

collections:
  - name: posts
    label: التدوينات
    label_singular: تدوينة
    folder: src/content/posts
    format: yaml-frontmatter
    slug: '{{fields._slug}}'
    # One folder per post holding index.md and its images. Empty media/public folders
    # make uploads entry-relative, which is the only form Astro can optimize in a body.
    path: '{{slug}}/index'
    media_folder: ''
    public_folder: ''
    thumbnail: coverImage
    sortable_fields: [publishDate, title]
    preview_path: '/blog/{{dirname}}'
    fields:
      - { name: title, label: العنوان, widget: string }
      - { name: description, label: الوصف, widget: text, required: false }
      - name: publishDate
        label: تاريخ النشر
        widget: datetime
        type: date
        input_timezone: utc
        default: '{{now}}'
      - { name: coverImage, label: صورة الغلاف, widget: image, required: false }
      - { name: body, label: المحتوى, widget: richtext }
