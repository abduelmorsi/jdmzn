# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: abduelmorsi/jdmzn

# Images live under src/ so Astro's <Image> can optimize them. public_folder is the
# path written to frontmatter, which Astro's image() schema helper resolves from the
# project root at build time — it is not a served URL.
media_folder: src/assets/posts
public_folder: /src/assets/posts

output:
  omit_empty_optional_fields: true

collections:
  - name: posts
    label: التدوينات
    label_singular: تدوينة
    folder: src/content/posts
    format: yaml-frontmatter
    slug: '{{fields._slug}}'
    thumbnail: coverImage
    sortable_fields: [publishDate, title]
    preview_path: '/blog/{{filename}}'
    fields:
      - { name: title, label: العنوان, widget: string }
      - { name: description, label: الوصف, widget: text, required: false }
      - name: publishDate
        label: تاريخ النشر
        widget: datetime
        type: date
        input_timezone: utc
        default: '{{now}}'
      - { name: coverImage, label: صورة الغلاف, widget: image, required: false }
      - { name: body, label: المحتوى, widget: richtext }
